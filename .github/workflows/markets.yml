# Updates stock, index and fund prices for "بكام النهاردة" (markets/ folder) every day.
# It only writes public market prices. No user data is read or written.
name: market prices
on:
  schedule:
    - cron: '45 12 * * 0-4'   # after the Egyptian Exchange closes (2:45 pm Cairo, Sunday to Thursday)
    - cron: '30 21 * * 1-5'   # after the US market closes
    - cron: '0 7 * * *'       # morning run: picks up the fund prices published overnight
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: market-prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch prices
        run: python3 tools/markets.py
      - name: Save
        run: |
          git config user.name "market-prices-bot"
          git config user.email "market-prices-bot@users.noreply.github.com"
          git add markets
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Market prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash || true
          git push
