<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-jUID7MWnXoDR30HgeaMhvRVDX4WQwmZUiabokIMMWNU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>Financial Aid</title>
<meta name="description" content="متابعة الكروت والقروض والجمعيات والسلف والمصروفات">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="logo-192.png">
<link rel="apple-touch-icon" href="logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;min-height:100%}
html{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
#boot{font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;padding:48px 20px;text-align:center;color:#f2f2f3;background:#000;min-height:100vh;box-sizing:border-box}
#boot h1{font-size:20px;margin:0 0 8px}
#boot p{color:#9b9ba1;margin:0 0 16px}
#boot button{font:inherit;border:0;border-radius:10px;padding:10px 16px;background:#e3bb55;color:#141108;margin:4px}
</style>
<style id="app-style"></style>
</head>
<body>
<div id="root"><div id="boot"><h1>Financial Aid</h1><p>بيحمّل…</p></div></div>
<script>
(function(){
  /* never inside someone else's page */
  try{if(window.top!==window.self){window.top.location.replace(window.self.location.href);return}}catch(e){document.documentElement.innerHTML='';return}
  /* the app fits the phone screen: no pinch zoom, no double-tap zoom, just scrolling */
  try{
    ['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});
    document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
    document.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},{passive:false});
  }catch(e){}
  var LNG=(function(){try{return localStorage.getItem('3bh_lang')||'ar'}catch(e){return 'ar'}})();
  function L(ar,en,fr){return LNG==='en'?en:LNG==='fr'?fr:ar}
  if(LNG!=='ar'){document.documentElement.setAttribute('dir','ltr');document.documentElement.setAttribute('lang',LNG);var bp=document.querySelector('#boot p');if(bp)bp.textContent=L('','Loading…','Chargement…')}
  var BUILTIN_VERSION='2.4.0', KEY='3bh_app_update';
  window.BUILTIN_VERSION=BUILTIN_VERSION;
  function cmpV(a,b){a=String(a).split('.').map(Number);b=String(b).split('.').map(Number);for(var i=0;i<3;i++){var d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
  function root(){return document.getElementById('root')}
  function fail(msg,canReset){
    root().innerHTML='<div id="boot"><h1>Financial Aid</h1><p>'+msg+'</p>'+
      (canReset?'<button id="b-reset">'+L('ارجع للنسخة الأصلية','Back to the original version','Revenir à la version d\'origine')+'</button>':'')+'<button id="b-reload">'+L('حاول تاني','Try again','Réessayer')+'</button></div>';
    var r=document.getElementById('b-reset');if(r)r.onclick=function(){try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
    document.getElementById('b-reload').onclick=function(){location.reload()};
  }
  function inject(b){
    window.APP_VERSION=b.version;window.APP_SOURCE='builtin';
    document.getElementById('app-style').textContent=b.css;
    root().innerHTML=b.html;
    /* the code always comes from the site's own app.js file: nothing stored on the phone is ever run as code */
    var s=document.createElement('script');s.src='app.js';s.onerror=function(){fail(L('ماقدرتش أحمّل ملفات البرنامج. اتأكد إن النت شغال أول مرة تفتحه.','Could not load the app files. Make sure you are online the first time you open it.','Impossible de charger les fichiers de l\'app. Vérifiez votre connexion à la première ouverture.'),false)};
    document.body.appendChild(s);
    setTimeout(function(){if(!window.__appReady)fail(L('البرنامج ما اشتغلش','The app did not start','L\'app n\'a pas démarré')+' ('+(window.__bootErr||L('خطأ غير معروف','unknown error','erreur inconnue'))+').',b.source==='update')},4000);
  }
  window.addEventListener('error',function(e){window.__bootErr=e.message});
  function builtin(){
    return Promise.all(['app.css','app.html'].map(function(f){return fetch(f).then(function(r){if(!r.ok)throw new Error(f+' '+r.status);return r.text()})}))
      .then(function(a){return {version:BUILTIN_VERSION,css:a[0],html:a[1],source:'builtin'}});
  }
  try{localStorage.removeItem(KEY)}catch(e){}   /* old in-app update files are no longer accepted */
  {
    builtin().then(inject).catch(function(e){fail(L('ماقدرتش أحمّل ملفات البرنامج. اتأكد إن النت شغال أول مرة تفتحه.','Could not load the app files. Make sure you are online the first time you open it.','Impossible de charger les fichiers de l\'app. Vérifiez votre connexion à la première ouverture.'),false)});
  }
  /* forced update: every open checks the site's sw.js version; a newer one installs and the app reopens by itself */
  var hadCtrl=!!(navigator.serviceWorker&&navigator.serviceWorker.controller), reloading=false;
  function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}
  function updGate(ver,stuck){
    var d=document.getElementById('upd-gate');
    if(!d){d=document.createElement('div');d.id='upd-gate';d.setAttribute('role','alertdialog');d.style.cssText='position:fixed;inset:0;z-index:400;background:#000;color:#f2f2f3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif';document.body.appendChild(d)}
    d.innerHTML='<div style="width:44px;height:44px;border-radius:50%;border:4px solid #3a3220;border-top-color:#e3bb55;animation:ugspin 1s linear infinite"></div><style>@keyframes ugspin{to{transform:rotate(360deg)}}</style>'+
      '<h2 style="margin:0;font-size:21px">'+L('في تحديث جديد','New update','Nouvelle mise à jour')+(ver?' (v'+ver+')':'')+'</h2><p style="margin:0;color:#9b9ba1;max-width:320px;line-height:1.7">'+
      (stuck?L('التحديث لسه ما نزلش. اتأكد إن النت شغال ودوس حاول تاني.','The update has not downloaded yet. Check your connection and tap Try again.','La mise à jour n\'est pas encore téléchargée. Vérifiez la connexion et touchez Réessayer.'):L('بينزل دلوقتي وهيفتح البرنامج تاني لوحده. بياناتك زي ما هي.','Downloading now; the app will reopen by itself. Your data stays as it is.','Téléchargement en cours ; l\'app va se rouvrir toute seule. Vos données restent intactes.'))+'</p>'+
      (stuck?'<div><button id="ug-retry" style="font:inherit;border:0;border-radius:10px;padding:10px 16px;background:#e3bb55;color:#141108;margin:4px">'+L('حاول تاني','Try again','Réessayer')+'</button></div>':'')+
      '<p style="margin:0;color:#6f6f75;font-size:12.5px">'+L('التحديث إجباري: البرنامج مش هيفتح بالنسخة القديمة.','This update is required: the app will not open with the old version.','Cette mise à jour est obligatoire : l\'app ne s\'ouvrira pas avec l\'ancienne version.')+'</p>';
    var a=document.getElementById('ug-retry');if(a)a.onclick=function(){ss('3bh-upd-try','0');hardReload(true)};
  }
  function hardReload(clear){if(reloading)return;reloading=true;
    var go=function(){location.reload()};
    if(clear&&window.caches)caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('3bh-')===0&&k!=='3bh-notify'}).map(function(k){return caches.delete(k)}))}).then(go,go);else go()}
  function checkRemote(reg){
    fetch('sw.js?v='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){
      var m=/CACHE='3bh-([0-9][0-9.]*)'/.exec(t||''); if(!m)return;
      var have=BUILTIN_VERSION;
      if(cmpV(m[1],have)<=0){ss('3bh-upd-try','0');return}
      var tries=+(ss('3bh-upd-try')||0);
      if(tries>=2){updGate(m[1],true);return}
      ss('3bh-upd-try',String(tries+1));updGate(m[1],false);
      if(reg)reg.update().catch(function(){});
      setTimeout(function(){hardReload(true)},7000);
    }).catch(function(){});
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.addEventListener('controllerchange',function(){if(hadCtrl&&!reloading){updGate('',false);hardReload(false)}});
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(reg){
        var check=function(){reg.update().catch(function(){});checkRemote(reg)};
        setTimeout(check,1200);
        document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check()});
        setInterval(check,10*60*1000);
      }).catch(function(){checkRemote(null)});
    });
  }
})();
</script>
</body>
</html>
